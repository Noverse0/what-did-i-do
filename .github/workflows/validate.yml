name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python lint tools
        run: python -m pip install ruff==0.16.3

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Lint and format-check Python
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Verify Agent Skills discovery
        run: npx --yes skills@1.5.22 add . --list
